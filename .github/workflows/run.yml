name: Realtime News Notification Bot

on:
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼
  repository_dispatch: # cron-job.org 외부 신호를 수신하는 설정
    types: [wake_up]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write[cite: 1]
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4[cite: 1]

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5[cite: 1]
        with:
          python-version: '3.11'[cite: 1]

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip[cite: 1]
          pip install google-genai[cite: 1]

      - name: 뉴스 크롤러 및 Gemini AI 브리핑 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}[cite: 1]
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}[cite: 1]
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}[cite: 1]
        run: |
          python main.py[cite: 1]

      - name: 발송 및 기록 자동 저장
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}[cite: 1]
        run: |
          git config --global user.name "github-actions[bot]"[cite: 1]
          git config --global user.email "github-actions[bot]@users.noreply.github.com"[cite: 1]
          git add sent_links.txt || true[cite: 1]
          git commit -m "update history [skip ci]" || echo "No changes to commit"[cite: 1]
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main[cite: 1]
